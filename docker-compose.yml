version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: api-hub-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-api_hub_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_here}
      POSTGRES_DB: ${DB_NAME:-api_hub_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-api_hub_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - api-hub-network

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: api-hub-backend
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER:-api_hub_user}:${DB_PASSWORD:-secure_password_here}@postgres:5432/${DB_NAME:-api_hub_db}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-encryption-key}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    networks:
      - api-hub-network
    command: sh -c "npm run migrate && npm run dev"
    restart: unless-stopped

  # Frontend Application
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: api-hub-frontend
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - api-hub-network
    restart: unless-stopped

networks:
  api-hub-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
